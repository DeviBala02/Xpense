server:
  port: 8080

spring:
  datasource:
    # Saved to a file, so your records are still there when you start the app again.
    # The file is created in the folder you start the app from: backend/data/budgetbee.mv.db
    url: jdbc:h2:file:${DB_FILE:./data/budgetbee};MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    time-zone: Asia/Kolkata

budgetbee:
  # How long a login stays valid on a device (days). Logging out ends it immediately.
  token-days: ${TOKEN_DAYS:30}
  ai:
    # true = use local Ollama (free) to understand chat messages; false = built-in rule parser only
    enabled: ${AI_ENABLED:false}
    base-url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2}

---
# Optional: use MySQL instead of the file database.
# Start with:  mvn spring-boot:run "-Dspring-boot.run.profiles=mysql"
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:budgetbee}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
